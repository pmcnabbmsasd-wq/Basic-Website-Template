<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Play Snake</h1>
  <p><a href="index.html">Back to home</a></p>
<canvas id="gameCanvas" width="400" height="400"></canvas>

</body>
<script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var dx = 20
    var dy= 0
    var CELL = 20;
    var snake = { x: 3, y: 6 };
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 400, 400);
    function drawBoard() {
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "blue";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
 
setInterval(step, 120);
function step() {
  snake.x = snake.x + 20;
 
  if (snake.x > 380) {
    snake.x = 0;
  }
 
  drawBoard();
}
 if (event.key === "ArrowUp") {
    dx = 0;
    dy = -20;
  }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 20;
  }

function step() {
  snake.x = snake.x + dx; 
  snake.y = snake.y + dy; 
 
  if (snake.x > 380) { snake.x = 0; }
  if (snake.x < 0) { snake.x = 380; }
  if (snake.y > 380) { snake.y = 0; }
  if (snake.y < 0) { snake.y = 380; }
 
  drawBoard();
}



  </script>
</html>
